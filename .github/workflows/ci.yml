name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Semgrep CE (pattern engine for the leak checks)
        run: pip install semgrep
      - run: npm ci
      - run: npm run licenses
      - run: npm test
        env:
          IV_REQUIRE_ENGINE: "1"
