name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Semgrep CE (pattern engine for the leak checks)
        run: pip install semgrep
      - run: npm ci
      - name: Install Chromium for the runtime tests
        run: npx playwright install --with-deps chromium
      - run: npm run licenses
      - run: npm test
        env:
          IV_REQUIRE_ENGINE: "1"

  # Runs this repository's own GitHub Action the way a user project would.
  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: iv
        uses: ./
        with:
          root: fixtures/react-fastapi
          engine: semgrep
          fail-on-findings: "false"
          sarif: iv.sarif
      - name: The gate fails on the broken fixture and SARIF lists the findings
        env:
          CODE: ${{ steps.iv.outputs.exit-code }}
          SARIF: ${{ steps.iv.outputs.sarif }}
        run: |
          test "$CODE" = "1"
          node -e 'const s=require("./"+process.env.SARIF); const n=s.runs[0].results.length; console.log(n+" results"); if (n < 10) process.exit(1)'
