#
# For the pre-commit framework (https://pre-commit.com). Needs the `iv` command on PATH
# (run `npm link` in packages/cli of a checkout of this repository).
# Without the framework, use `iv install --git-hook` instead.
- id: integration-verifier
  name: Integration Verifier gate
  description: Blocks the commit while it adds findings at or above gate.failOn, or touches files that have them
  entry: iv check --staged
  language: system
  pass_filenames: false
  always_run: true
